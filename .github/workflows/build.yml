name: Build and Release
on:
  push:
    branches:
      - jules-17588771482077852087-801c023c
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Download iChunUtil dependency
        run: |
          mkdir -p libs
          curl -L -o libs/iChunUtil-1.20.1-Forge-1.0.0.jar https://edge.forgecdn.net/files/5477/560/iChunUtil-1.20.1-Forge-1.0.0.jar
      - name: Build with Gradle
        run: ./gradlew build
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Morph-1.20.1
          path: build/libs/*.jar
      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.20.1-morph-port
          name: Morph 1.20.1 Port
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
