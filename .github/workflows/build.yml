name: Java CI with Gradle

on:
  push:
    branches: [ "master", "main", "1.20.1" ]
  pull_request:
    branches: [ "master", "main", "1.20.1" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Morph-1.20.1-JAR
        path: build/libs/Morph-1.20.1-1.0.0.jar
